<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101411">
  <title>Humanoid Control</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='6' fill='%23151e12'/%3E%3Cpath d='M1 1h62v62H1z' fill='none' stroke='%23afe06f' stroke-width='2'/%3E%3Ctext x='32' y='39' text-anchor='middle' font-family='monospace' font-size='20' font-weight='700' fill='%23afe06f'%3EH17%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/style.css?v=20260831">
</head>
<body>
  <a class="skip-link" href="#controlSection">Skip to controls</a>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">H17</span>
      <div>
        <h1>Humanoid Control</h1>
        <p id="clock">--:--:--</p>
      </div>
    </div>
    <div class="connection-row">
      <span id="streamState" class="status-dot offline"></span>
      <span id="streamLabel" aria-live="polite">Disconnected</span>
      <span id="modeBadge" class="badge">IDLE</span>
    </div>
  </header>

  <main>
    <section id="controlSection">
      <div class="control-safety panel">
        <div>
          <span class="eyebrow">CONTROL LINK</span>
          <strong id="controlStatus" aria-live="polite">Disabled</strong>
        </div>
        <div class="safety-actions">
          <button id="armButton" type="button" class="arm-button">Enable control</button>
          <button id="emergencyButton" type="button" class="emergency-button"><span>STOP</span><kbd>Esc</kbd></button>
        </div>
      </div>

      <div class="control-layout">
        <aside class="function-panel panel">
          <div class="panel-head">
            <div><span class="eyebrow">FUNCTION</span><h2>Operating mode</h2></div>
          </div>
          <div class="mode-list" role="group" aria-label="Robot function">
            <button type="button" class="active" data-mode="manual"><strong>Manual</strong><span>Walking and actions</span></button>
            <button type="button" data-mode="terrain"><strong>Terrain Auto</strong><span>IMU balance + stair traversal</span></button>
            <button type="button" data-mode="follow"><strong>Person Follow</strong><span>Camera + ToF tracking</span></button>
            <button type="button" data-mode="pickup"><strong>Pick Up</strong><span>Camera + ToF positioning</span></button>
          </div>
        </aside>

        <section class="drive-panel panel">
          <div class="panel-head">
            <div><span class="eyebrow">MANUAL CONTROL</span><h2>Locomotion</h2></div>
          </div>
          <div class="drive-body">
            <div class="dpad" aria-label="Walking direction">
              <button type="button" class="up" data-axis="forward" data-value="1" title="Forward">&uarr;</button>
              <button type="button" class="left" data-axis="turn" data-value="1" title="Turn left">&larr;</button>
              <button type="button" class="center" data-action="stop" title="Stop"><span>&#9632;</span><kbd>Space</kbd></button>
              <button type="button" class="right" data-axis="turn" data-value="-1" title="Turn right">&rarr;</button>
              <button type="button" class="down" data-axis="forward" data-value="-1" title="Backward">&darr;</button>
            </div>
            <div class="side-control">
              <span>Side walk</span>
              <div>
                <button type="button" data-axis="side" data-value="1" title="Side left"><span>&larr;</span><kbd>J</kbd></button>
                <button type="button" data-axis="side" data-value="-1" title="Side right"><span>&rarr;</span><kbd>K</kbd></button>
              </div>
            </div>
          </div>
          <div class="action-grid active" data-mode-actions="manual">
            <button type="button" data-action="dance"><span>Arm dance</span><kbd>L</kbd></button>
            <button type="button" data-action="getup_front"><span>Stand up</span><kbd>G</kbd></button>
            <button type="button" data-action="getup_back"><span>Get up back</span><kbd>B</kbd></button>
            <button type="button" data-action="reset"><span>Reset</span><kbd>C</kbd></button>
          </div>
          <div class="mode-actions">
            <div data-mode-actions="terrain">
              <button type="button" data-action="terrain_toggle"><span>Balance on/off</span><kbd>V</kbd></button>
              <button type="button" data-action="stair_toggle"><span>Auto stair on/off</span><kbd>U</kbd></button>
            </div>
            <div data-mode-actions="follow">
              <button type="button" data-action="follow"><span>Follow person</span><kbd>Y</kbd></button>
              <button type="button" data-action="ignore_person"><span>Stop follow</span><kbd>N</kbd></button>
            </div>
            <div data-mode-actions="pickup">
              <button type="button" data-action="pickup_toggle"><span>Start / lift / reset</span><kbd>R</kbd></button>
            </div>
          </div>
        </section>

        <section class="control-camera panel">
          <div class="panel-head">
            <div><span class="eyebrow">ROBOT VIEW</span><h2>Live camera</h2></div>
            <span id="cameraBadge" class="badge muted">OFF</span>
          </div>
          <div class="camera-frame">
            <img id="cameraFeed" src="/camera.mjpg" alt="Pi Camera live feed">
            <div id="cameraOffline" class="camera-offline">CAMERA OFFLINE</div>
          </div>
          <div class="mini-grid">
            <div><span>Status</span><strong id="motionStatus">Waiting</strong></div>
            <div><span>Balance</span><strong id="balanceStatus">--</strong></div>
            <div><span>Step</span><strong id="stepCount">0</strong></div>
            <div><span>Swing</span><strong id="swingLeg">NONE</strong></div>
          </div>
        </section>
      </div>
    </section>

  </main>

  <script type="module" src="/app.js?v=20260831"></script>
</body>
</html>
